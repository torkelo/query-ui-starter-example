services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # The plugin requires Grafana >= 13.2.0 (see plugin.json); the base file defaults to an older version.
        grafana_version: ${GRAFANA_VERSION:-13.2.4}
    environment:
      # Exposes /metrics, which the Prometheus container below scrapes.
      GF_METRICS_ENABLED: 'true'
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - '127.0.0.1:9090:9090'
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
